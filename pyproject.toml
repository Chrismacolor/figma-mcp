[project]
name = "figma-mcp-companion"
version = "0.1.0"
description = "Companion MCP server for fine-grained Figma canvas control — create, edit, and manipulate individual design nodes"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["server*"]

[project.scripts]
figma-mcp-companion = "server.main:main"
figma-mcp = "server.main:main"  # backward compat alias

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
